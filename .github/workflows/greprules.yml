name: Greprules App
run-name: Greprules App ${{ inputs.correlation }}
on:
  workflow_dispatch:
    inputs:
      intent_id: {required: true, type: string}
      configuration_revision: {required: true, type: string}
      source_sha: {required: true, type: string}
      source_tree: {required: true, type: string}
      source_kind: {required: true, type: string}
      source_name: {required: true, type: string}
      source_repository_id: {required: true, type: string}
      source_expires_at: {required: true, type: string}
      correlation: {required: true, type: string}
      installation_id: {required: true, type: string}
      policy_sha256: {required: true, type: string}
      context: {required: true, type: string}
      pull_id: {required: false, type: string, default: ''}
      pull_number: {required: false, type: string, default: ''}
      base_sha: {required: false, type: string, default: ''}
      base_ref: {required: false, type: string, default: ''}
      head_ref: {required: false, type: string, default: ''}
      head_repository_name: {required: false, type: string, default: ''}
permissions:
  contents: read
concurrency:
  group: greprules-app-${{ inputs.intent_id }}
  cancel-in-progress: false
jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INPUT_INTENT: ${{ inputs.intent_id }}
      INPUT_REVISION: ${{ inputs.configuration_revision }}
      INPUT_SHA: ${{ inputs.source_sha }}
      INPUT_TREE: ${{ inputs.source_tree }}
      INPUT_KIND: ${{ inputs.source_kind }}
      INPUT_NAME: ${{ inputs.source_name }}
      INPUT_REPOSITORY: ${{ inputs.source_repository_id }}
      INPUT_EXPIRES: ${{ inputs.source_expires_at }}
      INPUT_CORRELATION: ${{ inputs.correlation }}
      INPUT_INSTALLATION: ${{ inputs.installation_id }}
      INPUT_POLICY: ${{ inputs.policy_sha256 }}
      INPUT_CONTEXT: ${{ inputs.context }}
      INPUT_PULL_ID: ${{ inputs.pull_id }}
      INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
      INPUT_BASE_SHA: ${{ inputs.base_sha }}
      INPUT_BASE_REF: ${{ inputs.base_ref }}
      INPUT_HEAD_REF: ${{ inputs.head_ref }}
      INPUT_HEAD_REPOSITORY_NAME: ${{ inputs.head_repository_name }}
      EXECUTION_SHA: ${{ github.sha }}
      EXECUTION_REF: ${{ github.ref_name }}
      EXECUTION_REPOSITORY: ${{ github.repository }}
      EXECUTION_REPOSITORY_ID: ${{ github.repository_id }}
      EXECUTION_ACTOR_ID: ${{ github.actor_id }}
      EXECUTION_RUN_ID: ${{ github.run_id }}
      EXECUTION_ATTEMPT: ${{ github.run_attempt }}
      GREPRULES_VERSION: v0.5.1
      GREPRULES_OPENGREP_VERSION: "1.32.0"
      GREPRULES_OPENGREP_INCLUDE_DEFAULT_RULES: "false"
    steps:
      - name: Validate the saved execution request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, json, hashlib, datetime
          for key in ('INPUT_INTENT', 'INPUT_CORRELATION'):
              assert re.fullmatch(r'[A-Za-z0-9_-]{1,100}', os.environ[key])
          for key in ('INPUT_REVISION', 'INPUT_REPOSITORY', 'INPUT_INSTALLATION'):
              assert re.fullmatch(r'[1-9][0-9]{0,15}', os.environ[key])
          for key in ('INPUT_SHA', 'INPUT_TREE'):
              assert re.fullmatch(r'[a-f0-9]{40}', os.environ[key])
          assert os.environ['INPUT_CONTEXT'] in ('initial', 'pull_request')
          if os.environ['INPUT_CONTEXT'] == 'initial':
              assert os.environ['INPUT_REPOSITORY'] == os.environ['EXECUTION_REPOSITORY_ID']
              assert all(not os.environ[k] for k in ('INPUT_PULL_ID','INPUT_PULL_NUMBER','INPUT_BASE_SHA','INPUT_BASE_REF','INPUT_HEAD_REF','INPUT_HEAD_REPOSITORY_NAME'))
          else:
              assert all(re.fullmatch(r'[1-9][0-9]{0,15}', os.environ[k]) for k in ('INPUT_PULL_ID','INPUT_PULL_NUMBER'))
              assert re.fullmatch(r'[a-f0-9]{40}', os.environ['INPUT_BASE_SHA'])
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}', os.environ['INPUT_HEAD_REPOSITORY_NAME'])
              assert os.environ['INPUT_KIND'] == 'branch' and os.environ['INPUT_NAME'] == os.environ['INPUT_HEAD_REF']
          assert os.environ['INPUT_KIND'] in ('branch', 'tag')
          for name in [os.environ['INPUT_NAME']] + ([os.environ['INPUT_BASE_REF']] if os.environ['INPUT_CONTEXT'] == 'pull_request' else []):
              assert name and len(name.encode()) <= 255 and name != '@'
              assert not re.search(r'[\x00-\x20\x7f~^:?*\[\\]', name) and '..' not in name and '@{' not in name and not name.endswith('.')
              assert all(p and not p.startswith('.') and not p.endswith('.lock') for p in name.split('/'))
          expires = datetime.datetime.fromisoformat(os.environ['INPUT_EXPIRES'].replace('Z', '+00:00'))
          assert expires > datetime.datetime.now(datetime.timezone.utc)
          policy = (json.dumps({'schemaVersion':'greprules.local.v1','packs':[],'registry':'https://api.greprules.io'}, separators=(',',':'))+'\n').encode()
          assert hashlib.sha256(policy).hexdigest() == os.environ['INPUT_POLICY']
          root = os.path.join(os.environ['GITHUB_WORKSPACE'], 'scan-root')
          os.makedirs(os.path.join(root, '.greprules'), exist_ok=True)
          open(os.path.join(root, '.greprules', 'config.local.json'), 'wb').write(policy)
          PY
      - name: Checkout the exact saved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.context == 'pull_request' && format('refs/pull/{0}/head', inputs.pull_number) || inputs.source_sha }}
          path: scan-root/source
          lfs: false
          submodules: false
      - name: Scan unchanged source with fresh Registry policy
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/greprules-app-v3-artifact"
          isolated="$RUNNER_TEMP/greprules-app-v3-isolated"
          mkdir "$stage" "$isolated"
          mkdir -p "$stage/provenance/manifests" "$isolated/home" "$isolated/state" "$isolated/cache" "$isolated/pack-cache" "$isolated/bin"
          export STAGING="$stage" HOME="$isolated/home"
          export GREPRULES_STATE_HOME="$isolated/state" GREPRULES_CACHE_HOME="$isolated/cache" GREPRULES_CACHE_DIR="$isolated/pack-cache"
          export GREPRULES_INSTALL_DIR="$isolated/bin" PATH="$isolated/bin:$PATH"
          export SCAN_ROOT="$GITHUB_WORKSPACE/scan-root"
          export SCAN_STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$isolated/hash-source.py" <<'PY'
          import os, subprocess, json, hashlib, stat
          root = os.path.join(os.environ['SCAN_ROOT'], 'source')
          def git(*args): return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', '-C', root, *args])
          assert git('rev-parse', 'HEAD').decode().strip() == os.environ['INPUT_SHA']
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == os.environ['INPUT_TREE']
          files = []
          for row in git('ls-files', '--stage', '-z').split(b'\0'):
              if not row: continue
              info, rawpath = row.split(b'\t', 1)
              mode, oid, stage = info.decode().split(' ')
              path = rawpath.decode('utf-8', 'strict')
              assert mode in ('100644','100755') and stage == '0'
              assert len(path.encode()) <= 1024 and '\\' not in path and not any(ord(c)<32 or ord(c)==127 for c in path)
              assert all(p not in ('', '.', '..') for p in path.split('/'))
              fullpath = os.path.join(root, path)
              st = os.lstat(fullpath)
              assert stat.S_ISREG(st.st_mode)
              actual = hashlib.sha1(('blob '+str(st.st_size)+'\0').encode())
              digest = hashlib.sha256()
              with open(fullpath, 'rb') as handle:
                  while True:
                      data = handle.read(65536)
                      if not data: break
                      actual.update(data); digest.update(data)
              assert actual.hexdigest() == oid
              files.append({'path':path,'blobSha':oid,'size':st.st_size,'sha256':digest.hexdigest()})
          assert len(files) <= 10000
          value = {'schema':'greprules.source-hashes.v1','commitSha':os.environ['INPUT_SHA'],'treeSha':os.environ['INPUT_TREE'],'prefix':'source/','files':sorted(files,key=lambda x:x['path'])}
          data = json.dumps(value, separators=(',',':'), ensure_ascii=False).encode()
          assert len(data) <= 2097152
          print(data.decode())
          PY
          python3 "$isolated/hash-source.py" > "$stage/provenance/source-hashes.json"
          curl -fsSL https://raw.githubusercontent.com/greprules/greprules/69e8a0a735a9ee318ba96e506b86fd21747db0ab/install.sh | sh
          greprules version > "$stage/greprules-version.txt"
          cd "$SCAN_ROOT"
          greprules scan source --root . --sarif --output "$stage/greprules.sarif" --verbose
          python3 "$isolated/hash-source.py" > "$isolated/source-after.json"
          cmp "$stage/provenance/source-hashes.json" "$isolated/source-after.json"
          python3 - <<'PY'
          import os, json, hashlib, shutil, re
          stage = os.environ['STAGING']
          roots = [os.path.realpath(os.environ[k]) for k in ('GREPRULES_STATE_HOME','GREPRULES_CACHE_HOME','GREPRULES_CACHE_DIR')]
          def under(path): return any(os.path.commonpath([os.path.realpath(path),r]) == r for r in roots)
          locks = []
          for directory, _, names in os.walk(os.environ['GREPRULES_STATE_HOME']):
              if 'lock.json' in names: locks.append(os.path.join(directory,'lock.json'))
          assert len(locks) == 1
          lockpath = os.path.join(stage,'provenance','lock.json')
          shutil.copyfile(locks[0],lockpath)
          lock = json.load(open(lockpath))
          manifests = {}
          for pack in lock['packs']:
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,80}',pack['id']) and under(pack['manifestPath'])
              target = os.path.join(stage,'provenance','manifests',pack['id']+'.manifest.json')
              shutil.copyfile(pack['manifestPath'],target)
              manifests[pack['id']] = hashlib.sha256(open(target,'rb').read()).hexdigest()
          json.dump({'lock_sha256':hashlib.sha256(open(lockpath,'rb').read()).hexdigest(),'manifests':manifests},open(os.path.join(stage,'provenance','manifest-hashes.json'),'w'))
          envelope = {'schema':'greprules.scan-envelope.v3','templateVersion':'app-dispatch-v3',
            'repository':{'id':int(os.environ['EXECUTION_REPOSITORY_ID']),'fullName':os.environ['EXECUTION_REPOSITORY']},
            'installationId':int(os.environ['INPUT_INSTALLATION']),'intentId':os.environ['INPUT_INTENT'],'configurationRevision':int(os.environ['INPUT_REVISION']),
            'correlation':os.environ['INPUT_CORRELATION'],'context':os.environ['INPUT_CONTEXT'],
            'source':{'kind':os.environ['INPUT_KIND'],'name':os.environ['INPUT_NAME'],'commitSha':os.environ['INPUT_SHA'],'treeSha':os.environ['INPUT_TREE'],'headRepositoryGithubId':int(os.environ['INPUT_REPOSITORY']),'prefix':'source/'},
            'workflow':{'name':'Greprules App','path':'.github/workflows/greprules.yml','runId':int(os.environ['EXECUTION_RUN_ID']),'attempt':int(os.environ['EXECUTION_ATTEMPT']),'event':'workflow_dispatch','executionSha':os.environ['EXECUTION_SHA'],'branch':os.environ['EXECUTION_REF'],'actorId':int(os.environ['EXECUTION_ACTOR_ID'])},
            'scan':{'command':'greprules scan source --root . --sarif --output greprules.sarif --verbose','status':'completed','exitCode':0,'cliVersion':'0.5.1','freshState':True,'includeDefaultRules':False,'policySha256':os.environ['INPUT_POLICY'],'startedAt':os.environ['SCAN_STARTED']}}
          if os.environ['INPUT_CONTEXT'] == 'pull_request':
              envelope['pull'] = {'id':int(os.environ['INPUT_PULL_ID']),'number':int(os.environ['INPUT_PULL_NUMBER']),
                'base':{'repositoryId':int(os.environ['EXECUTION_REPOSITORY_ID']),'fullName':os.environ['EXECUTION_REPOSITORY'],'ref':os.environ['INPUT_BASE_REF'],'sha':os.environ['INPUT_BASE_SHA']},
                'head':{'repositoryId':int(os.environ['INPUT_REPOSITORY']),'fullName':os.environ['INPUT_HEAD_REPOSITORY_NAME'],'ref':os.environ['INPUT_HEAD_REF'],'sha':os.environ['INPUT_SHA']}}
          json.dump(envelope,open(os.path.join(stage,'envelope.json'),'w'))
          PY
      - name: Upload immutable scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: greprules-app-v3-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/greprules-app-v3-artifact
          retention-days: 30
          if-no-files-found: error
          overwrite: false
